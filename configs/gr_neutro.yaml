# Configuration file for GR-Neutro dataset

dataset:
  name: gr_neutro
  root_dir: path/to/gr_neutro_dataset
  class_names:
    - Normal
    - Chromatin
    - Dohle
    - Hypergranulation
    - Hypersegmentation
    - Hypogranulation
    - Hyposegmentation
  transform:
    train:
      - type: RandomResizedCrop
        size: 224
        scale: [0.8, 1.0]
      - type: RandomHorizontalFlip
        p: 0.5
      - type: RandomVerticalFlip
        p: 0.5
      - type: ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - type: RandomRotation
        degrees: 10
      - type: ToTensor
      - type: Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    val:
      - type: Resize
        size: 256
      - type: CenterCrop
        size: 224
      - type: ToTensor
      - type: Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    test:
      - type: Resize
        size: 256
      - type: CenterCrop
        size: 224
      - type: ToTensor
      - type: Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

model:
  backbone: dinobloom-s  # Paper Section 3.4: "we utilize DinoBloom-S"
  num_classes: 7
  dropout_rate: 0.5
  base_threshold: 0.5

training:
  batch_size: 32
  epochs: 50
  num_workers: 4
  constraint_lr: 1e-4
  classifier_lr: 1e-4
  threshold_lr: 5e-5
  weight_decay: 0.01

  # Monte Carlo samples
  mc_samples_train: 5   # MC samples per batch during training
  mc_samples_val: 50    # MC samples per batch during validation

  # Early stopping parameters
  early_stopping_patience: 10  # Stop training if no improvement for this many epochs
  early_stopping_metric: 'f1_weighted'  # Metric to monitor for early stopping

  # Backbone freezing — Paper Section 3.4: "keeping the DinoBloom feature extractor frozen"
  freeze_backbone: true
  
  # Learning rate scheduler config
  scheduler:
    type: cosine
    min_lr: 1e-6
  
  # Checkpoint and visualization intervals
  checkpoint_interval: 5
  visualization_interval: 10
  
  # Loss function hyperparameters
  loss:
    lambda_con: 0.1
    lambda_unc: 0.1
    lambda_entropy: 0.01
    alpha: 0.01
    beta: 0.1
    uncertainty_threshold: 0.2

inference:
  mc_samples: 50
  batch_size: 32
  num_workers: 4
